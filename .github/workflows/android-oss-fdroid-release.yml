name: Android OSS F-Droid release

on:
  workflow_dispatch:
    inputs:
      draft_tag:
        description: Draft release tag that will receive the APKs
        required: true
        default: fdroid-oss-build
      buildserver_image:
        description: F-Droid buildserver image (use the digest from an F-Droid job to pin it exactly)
        required: true
        default: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie

permissions:
  contents: write

jobs:
  build:
    name: Build OSS APKs in F-Droid buildserver
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build OSS releases
        shell: bash
        env:
          FDROID_BUILDSERVER_IMAGE: ${{ inputs.buildserver_image }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          docker pull "$FDROID_BUILDSERVER_IMAGE"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/home/vagrant/build/com.aryan.reader.oss" \
            --volume "$GITHUB_WORKSPACE/release-assets:/release-assets" \
            "$FDROID_BUILDSERVER_IMAGE" \
            bash -lc '
              set -euo pipefail
              source /etc/profile.d/bsenv.sh
              cd /home/vagrant/build/com.aryan.reader.oss

              # The F-Droid buildserver image ships no C compiler either, and cargo
              # compiles every proc-macro/build script (proc-macro2, serde, quote, …)
              # for the build host, where rustc links through `cc`.
              if ! command -v cc >/dev/null 2>&1; then
                apt-get update
                apt-get install -y --no-install-recommends gcc libc6-dev
              fi

              # The F-Droid buildserver image ships no Rust toolchain, but the APK
              # build compiles rust/office-oxide-bridge with cargo (:app:buildOfficeOxide*).
              # rustup follows rust/office-oxide-bridge/rust-toolchain.toml, so the
              # pinned channel and its Android targets install on first cargo run.
              export PATH="$HOME/.cargo/bin:$PATH"
              if ! command -v cargo >/dev/null 2>&1; then
                curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                  | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
              fi
              ( cd rust/office-oxide-bridge && cargo --version )

              # The image ships an empty /opt/android-sdk/ndk. AGP would install the
              # NDK lazily during the build, but the cargo target linker is resolved at
              # configuration time, before that, so cargo would fall back to the host
              # cc and fail with "Relocations in generic ELF (EM: 183)". Install the
              # NDK declared in app/build.gradle.kts up front and point the build at it.
              ndk_version=$(sed -n "s/.*androidNdkVersion *= *\"\([0-9.]*\)\".*/\1/p" app/build.gradle.kts | head -1)
              test -n "$ndk_version"
              sdkmanager --install "ndk;$ndk_version"
              export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ndk_version"

              sed -i -e "/jogamp/d" -e "/https.jitpack/d" settings.gradle.kts
              ./gradlew :app:assembleOssRelease --no-build-cache --max-workers=1 -Pkotlin.daemon.jvmargs=-Xmx4g
              cp app/build/outputs/renamed-apk/ossRelease/*.apk /release-assets/
            '
          sudo chown -R "$(id -u):$(id -g)" release-assets

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ inputs.draft_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$DRAFT_TAG" >/dev/null 2>&1; then
            gh release create "$DRAFT_TAG" \
              --draft \
              --target main \
              --title "F-Droid OSS build" \
              --notes "Manually built from main in the F-Droid buildserver image."
          fi
          gh release upload "$DRAFT_TAG" release-assets/*.apk --clobber
