			shellPath = /bin/sh;
			shellScript = "set -eu\n# App Store Connect rejects loose .dylib files inside Frameworks (ITMS-90426).\n# Native libs must be statically linked or embedded as .framework bundles.\nFRAMEWORKS_DIR=\"${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}\"\nif [ ! -f \"$FRAMEWORKS_DIR/Pdfium.framework/Pdfium\" ]; then\n  echo \"error: Pdfium.framework was not embedded in $FRAMEWORKS_DIR\" >&2\n  exit 1\nfi\nLOOSE_DYLIBS=\"$(find \"$FRAMEWORKS_DIR\" -maxdepth 1 -name '*.dylib' -print)\"\nif [ -n \"$LOOSE_DYLIBS\" ]; then\n  echo \"error: Loose .dylib files must not be embedded in Frameworks: $LOOSE_DYLIBS\" >&2\n  exit 1\nfi\n# App Store Connect requires CFBundleShortVersionString to be at most three\n# dot-separated integers (server error 90060); fail fast instead of at upload.\nPDFIUM_VERSION=\"$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' \"$FRAMEWORKS_DIR/Pdfium.framework/Info.plist\")\"\nif ! printf '%s' \"$PDFIUM_VERSION\" | grep -Eq '^[0-9]+(\\.[0-9]+){0,2}$'; then\n  echo \"error: Pdfium.framework CFBundleShortVersionString '$PDFIUM_VERSION' must be at most three dot-separated integers\" >&2\n  exit 1\nfi\n# The framework's MinimumOSVersion must match its binary LC_BUILD_VERSION\n# minos, otherwise App Store Connect rejects it with ITMS-90208.\nPDFIUM_MINOS_PLIST=\"$(/usr/libexec/PlistBuddy -c 'Print MinimumOSVersion' \"$FRAMEWORKS_DIR/Pdfium.framework/Info.plist\")\"\nPDFIUM_MINOS_BINARY=\"$(otool -l \"$FRAMEWORKS_DIR/Pdfium.framework/Pdfium\" | awk '/minos/ {print $2; exit}')\"\nif [ \"$PDFIUM_MINOS_PLIST\" != \"$PDFIUM_MINOS_BINARY\" ]; then\n  echo \"error: Pdfium.framework MinimumOSVersion '$PDFIUM_MINOS_PLIST' does not match binary minos '$PDFIUM_MINOS_BINARY'\" >&2\n  exit 1\nfi\n";
